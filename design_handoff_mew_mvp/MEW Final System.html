<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MEW — Final System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #101010; }
  #root { height: 100%; }
  .doc, .doc *{ box-sizing:border-box; }
  .doc{ font-family:'Hanken Grotesk', system-ui, sans-serif; color:#2b2620; }
  .doc h1{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:30px; margin:0 0 8px; letter-spacing:-0.01em; }
  .doc h1 b{ color:#a4761f; }
  .doc p{ font-size:15px; line-height:1.6; color:#6f6453; margin:0 0 10px; }
  .doc b{ color:#2b2620; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="surfaces.jsx"></script>
<script type="text/babel" src="mew-v5-calendar.jsx"></script>
<script type="text/babel" src="mew-v8-core.jsx"></script>
<script type="text/babel" src="mew-v9-den.jsx"></script>
<script type="text/babel" src="mew-v10-dev.jsx"></script>
<script type="text/babel" src="mew-v11-final.jsx"></script>
<script type="text/babel" src="mew-v12-clock.jsx"></script>
<script type="text/babel" src="mew-v13-rings.jsx"></script>
<script type="text/babel" src="mew-v14-bezel.jsx"></script>
<script type="text/babel" src="mew-v15-spotlight.jsx"></script>
<script type="text/babel" src="mew-v16-noir.jsx"></script>
<script type="text/babel" src="mew-v17-week.jsx"></script>
<script type="text/babel" src="mew-v18-weekstyles.jsx"></script>
<script type="text/babel" src="mew-v19-steel.jsx"></script>
<script type="text/babel" src="mew-v21-system.jsx"></script>
<script type="text/babel" src="mew-v22-settings.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
function Intro() {
  return (
    <div className="doc" style={{ width: 1224 }}>
      <h1>MEW — <b>the final system</b>, themed per pet</h1>
      <p style={{ maxWidth: 980 }}>Everything on Carbon (pitch-black) + Pet White (warm accented white). The big additions: a <b>companion stage</b> in the right column that reserves real space for the animated 3D / vector companion (placeholder floats where the rig will live), and <b>per-pet theming</b> — choosing a pet swaps the accent pair across the entire UI while the carbon/steel structure stays fixed. The main page and settings are <b>live</b> — toggle Focus/Week, and in Settings <b>click a pet</b> to re-theme the page.</p>
    </div>
  );
}

function PetRow() {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {PETS.map((p) => (
        <div key={p.id} style={{ transform: "scale(0.5)", transformOrigin: "top left", width: 1280, height: 420, marginBottom: -210, overflow: "hidden", borderRadius: 24 }}>
          <SurfaceMain pet={p.id} defaultView="focus" reveal />
        </div>
      ))}
    </div>
  );
}

function App() {
  return (
    <React.Fragment>
      <StlStyles /><VDenStyles /><DevStyles /><FinStyles /><ClkStyles /><RngStyles /><BzStyles /><SpStyles /><NxStyles /><NxwStyles /><NxbStyles /><NsStyles /><SystemStyles />
      <DesignCanvas>
        <DCSection id="intro" title="MEW" subtitle="Final system · per-pet theming + companion stage">
          <DCArtboard id="brief" label="The system" width={1280} height={210}>
            <div style={{ padding: 26, background: "#f6f1e8", width: "100%", height: "100%", boxSizing: "border-box" }}><Intro /></div>
          </DCArtboard>
        </DCSection>

        <DCSection id="main" title="Main page · live" subtitle="Carbon default — toggle Focus/Week; companion stage reserves the animated-pet space">
          <DCArtboard id="live" label="Main · Focus (live)" width={1280} height={840}><SurfaceMain pet="cat" reveal /></DCArtboard>
          <DCArtboard id="week" label="Main · Week" width={1280} height={840}><SurfaceMain pet="cat" defaultView="week" /></DCArtboard>
          <DCArtboard id="lightmain" label="Main · Pet White (light)" width={1280} height={840}><SurfaceMain pet="cat" light reveal /></DCArtboard>
        </DCSection>

        <DCSection id="settings" title="Settings · live" subtitle="Click a pet to re-theme · Carbon + Pet White · locked principles">
          <DCArtboard id="set" label="Settings (live pet picker)" width={1280} height={840}><SurfaceSettings /></DCArtboard>
          <DCArtboard id="setlight" label="Settings · Pet White" width={1280} height={840}><SurfaceSettings light /></DCArtboard>
        </DCSection>

        <DCSection id="themes" title="Theme follows pet" subtitle="One system, five pets — the accent pair swaps, the structure holds">
          <DCArtboard id="petrow" label="Cat · Dog · Fox · Bunny · Bird" width={640} height={1100}>
            <div style={{ width: 640, height: 1100, background: "#0b0c0e", padding: 16, boxSizing: "border-box" }}><PetRow /></div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
