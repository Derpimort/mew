<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MEW — Final v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #101010; }
  #root { height: 100%; }
  .doc, .doc *{ box-sizing:border-box; }
  .doc{ font-family:'Hanken Grotesk', system-ui, sans-serif; color:#2b2620; }
  .doc h1{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:29px; margin:0 0 8px; letter-spacing:-0.01em; }
  .doc h1 b{ color:#a4761f; }
  .doc p{ font-size:14.5px; line-height:1.6; color:#6f6453; margin:0 0 9px; }
  .doc b{ color:#2b2620; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="surfaces.jsx"></script>
<script type="text/babel" src="mew-v5-calendar.jsx"></script>
<script type="text/babel" src="mew-v8-core.jsx"></script>
<script type="text/babel" src="mew-v9-den.jsx"></script>
<script type="text/babel" src="mew-v10-dev.jsx"></script>
<script type="text/babel" src="mew-v11-final.jsx"></script>
<script type="text/babel" src="mew-v12-clock.jsx"></script>
<script type="text/babel" src="mew-v13-rings.jsx"></script>
<script type="text/babel" src="mew-v14-bezel.jsx"></script>
<script type="text/babel" src="mew-v15-spotlight.jsx"></script>
<script type="text/babel" src="mew-v16-noir.jsx"></script>
<script type="text/babel" src="mew-v17-week.jsx"></script>
<script type="text/babel" src="mew-v18-weekstyles.jsx"></script>
<script type="text/babel" src="mew-v19-steel.jsx"></script>
<script type="text/babel" src="mew-v21-system.jsx"></script>
<script type="text/babel" src="mew-v22-settings.jsx"></script>
<script type="text/babel" src="mew-v24-threads.jsx"></script>
<script type="text/babel" src="mew-v25-focus.jsx"></script>
<script type="text/babel" src="mew-v26-priority.jsx"></script>
<script type="text/babel" src="mew-v27-canonical.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
function Intro() {
  return (
    <div className="doc" style={{ width: 1224 }}>
      <h1>MEW — <b>Final v2</b> · the canonical main page</h1>
      <p style={{ maxWidth: 1010 }}>Focus is now <b>orbit lanes</b>: every item the same thin labeled arc, the focus item owning the outer orbit + the center, callout labels with leader lines so overlap is impossible. <b>One click on any item promotes it</b>; the chip under the task demotes it to run in background. The iPhone-swap case is native: dashed-gold arc to its <b>due</b> tick, never monopolizing the center. Loose-threads rail on the left, live clock on top, Week stays solid columns. Everything here is live — click items, toggle Focus/Week, open the rail.</p>
    </div>
  );
}

function App() {
  return (
    <React.Fragment>
      <StlStyles /><VDenStyles /><DevStyles /><FinStyles /><ClkStyles /><RngStyles /><BzStyles /><SpStyles /><NxStyles /><NxwStyles /><NxbStyles /><NsStyles /><SystemStyles /><ThreadStyles /><FocusStyles /><PriStyles />
      <DesignCanvas>
        <DCSection id="intro" title="MEW" subtitle="Final v2 · orbit lanes locked">
          <DCArtboard id="brief" label="The system" width={1280} height={186}>
            <div style={{ padding: 26, background: "#f6f1e8", width: "100%", height: "100%", boxSizing: "border-box" }}><Intro /></div>
          </DCArtboard>
        </DCSection>
        <DCSection id="main" title="Main page · live" subtitle="Click any item to focus · demote chip · threads rail · Focus ⇄ Week">
          <DCArtboard id="focus" label="Focus · orbit lanes (live)" width={1280} height={840}><SurfaceMew /></DCArtboard>
          <DCArtboard id="bg" label="Focus · demoted — nothing holds you" width={1280} height={840}><SurfaceMew defaultFocus={null} /></DCArtboard>
          <DCArtboard id="week" label="Week · solid columns" width={1280} height={840}><SurfaceMew defaultView="week" /></DCArtboard>
          <DCArtboard id="light" label="Focus · Pet White (light)" width={1280} height={840}><SurfaceMew light /></DCArtboard>
        </DCSection>
        <DCSection id="set" title="Settings" subtitle="Live pet picker — theme follows pet">
          <DCArtboard id="settings" label="Settings" width={1280} height={840}><SurfaceSettings /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
