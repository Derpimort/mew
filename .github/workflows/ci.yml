name: ci

# Quick gate — the fast feedback loop on EVERY PR (issue: two-tier gitflow).
#
# This is the only suite a feature PR into `develop` runs: typecheck + unit
# tests + lint, all pure-JS, ~2-3 min. It's the cheap, always-on net that keeps
# day-to-day work moving without paying for the heavy build/e2e/perf suites on
# every push. Those (desktop build + cargo, Playwright e2e, Lighthouse,
# UI-overlap, dependency audit) are gated to release-promotion PRs — i.e. PRs
# whose base is `main` (a `develop → main` promotion) — where the extra minutes
# are worth it. See CONTRIBUTING.md "Branch flow & CI".
#
# The eslint + prettier gate folded in here used to be its own lint.yml; it now
# lives alongside typecheck/unit so the whole quick gate is one workflow. Setup
# (pnpm 9, node 22, pnpm cache keyed on app/pnpm-lock.yaml) mirrors the other
# app/ workflows so caching and versions stay consistent.
on:
  pull_request:
    # RC branches are vYYYY.MM-rcN (CalVer, e.g. v2026.09-rc1): 'v*-rc*' matches them;
    # 'v*-rc' stays for the legacy spelling. See .github/RELEASES.md.
    branches: [develop, main, 'v*-rc', 'v*-rc*']
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
      # the release-version guard's inputs (see the release-guard job)
      - 'desktop/src-tauri/tauri.conf.json'
      - 'desktop/package.json'
      - 'desktop/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Release-version guard (CalVer, see .github/RELEASES.md): the config shape, the MSI
  # version mapping and the guard's own cases, on every PR that touches them.
  # desktop.yml's `check` job only fires on PRs into main, so without this a PR into
  # the RC could break tauri.conf.json or the guard unnoticed until promotion. ~20s.
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node desktop/scripts/check-release-version.mjs --shape
      - run: node --test desktop/scripts/__tests__/check-release-version.test.mjs

  # Strict typecheck — tsc -b across the app/ project references, no errors.
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: npx tsc -b

  # Production build + bundle-size budget. The budget step used to live only in
  # desktop.yml's `check` job, which fires on PRs into main — so a PR into the RC
  # could grow a chunk past its hard budget unnoticed until promotion (#54's lazy ai
  # chunk did). This runs the same `pnpm build` + check-bundle-size.mjs on PRs into
  # develop and the RC; on PRs into main it is skipped, because desktop.yml's check
  # already runs that exact step there (same paths, app/**) and the minutes would
  # double. workflow_dispatch has no base_ref, so a manual run always builds.
  # The per-chunk breakdown goes to the job summary. ~1-2 min.
  bundle:
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs dist

  # Unit suite — the domain + adapter + store vitest run. A red test fails the PR.
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ESLint + Prettier gate (folded in from the old lint.yml).
  #
  # BLOCKING and diff-scoped: a fast pre-merge mirror of the husky pre-commit
  # hook, linting and format-checking only the files a PR actually changes —
  # quick feedback re-checked here in case the hook was bypassed. Whole-tree
  # enforcement now lives in the blocking `lint-full` job below, which holds the
  # entire codebase to zero findings; this job keeps a PR's own diff to that same
  # standard a step earlier. Setup mirrors typecheck/unit above.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base commit to diff against
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile

      - name: Collect changed app/ files
        id: changed
        working-directory: ${{ github.workspace }}
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          # Added/Copied/Modified/Renamed app/ files (skip deletions), made app-relative.
          changed=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- 'app/' \
            | sed 's#^app/##')
          {
            echo 'files<<EOF'
            echo "$changed"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Changed app/ files:"; echo "$changed"

      - name: ESLint changed (*.ts, *.tsx)
        run: |
          files=$(printf '%s\n' "${{ steps.changed.outputs.files }}" \
            | grep -E '\.(ts|tsx)$' || true)
          if [ -z "$files" ]; then
            echo "No changed TS/TSX in app/ — nothing to lint."; exit 0
          fi
          echo "$files" | tr '\n' '\0' | xargs -0 npx eslint --max-warnings=0

      - name: Prettier --check changed
        run: |
          files=$(printf '%s\n' "${{ steps.changed.outputs.files }}" \
            | grep -E '\.(ts|tsx|js|mjs|cjs|json|css|html|md)$' || true)
          if [ -z "$files" ]; then
            echo "No changed Prettier-managed files in app/ — nothing to check."; exit 0
          fi
          echo "$files" | tr '\n' '\0' | xargs -0 npx prettier --check

  # Full-tree ESLint + Prettier — a HARD gate. The tree was brought to zero
  # lint + format findings in v0.2.0, so this blocks any PR that reintroduces
  # debt. The diff-scoped `lint` job above is kept as a fast husky mirror.
  lint-full:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: ESLint (full codebase)
        run: pnpm lint
      - name: Prettier --check (full codebase)
        run: pnpm format:check
