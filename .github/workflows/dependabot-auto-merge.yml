name: dependabot-auto-merge

# Auto-merge the security-sensitive patch/minor bumps Dependabot opens (the
# `security` group in .github/dependabot.yml: @noble/*, @anthropic-ai/*,
# @ai-sdk/*, tauri*, serde*, tokio, …). "Auto" means: queue the merge, and
# GitHub completes it only AFTER required checks pass — the audit workflow's
# high/critical gate still has to be green, so a vulnerable bump never merges
# itself. Majors and everything outside the security group stay manual.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Enable auto-merge for security patch/minor bumps
        if: |
          steps.meta.outputs.dependency-group == 'security' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
