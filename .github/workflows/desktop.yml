name: desktop

on:
  pull_request:
    # Heavy gate: the `check` job is only meant for release-promotion PRs
    # (base=main, i.e. develop → main). Day-to-day PRs into develop run the
    # quick gate (ci.yml) instead. Tag pushes + dry-run dispatch are unchanged.
    branches: ['main']
    paths: ['desktop/**', 'app/**', '.github/workflows/desktop.yml']
  push:
    tags: ['v*']
  workflow_dispatch: # dry-run: full matrix build, updater artifacts, no release

env:
  APT_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev pkg-config

permissions:
  contents: write # the release job creates draft releases; check only reads


jobs:
  # PR gate: the shell compiles against a real app bundle
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ubuntu is case-sensitive, so two paths differing only in case (e.g.
      # markdown.ts vs Markdown.tsx) coexist here but collide on case-insensitive
      # Windows — that's the class that broke the v0.1.7 release (#144). Catch it
      # at PR time: fail if any tracked paths fold to the same lowercase string.
      - name: Guard against filename case-collisions
        run: |
          dupes=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "case-colliding paths (would break case-insensitive Windows):"
            echo "$dupes"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - uses: oven-sh/setup-bun@v2
      # the bundled brain: compile the pinned gbrain into the sidecar slot so
      # a PR that breaks the compile (or the pin) fails here, not at release
      - run: node desktop/scripts/build-sidecar.mjs
      - run: pnpm --dir app install --frozen-lockfile
      # supply-chain gate before we spend time building: any known advisory in
      # the lockfile fails here (audit.yml runs the same OSV check standalone +
      # on a schedule; see there for why pnpm audit itself is retired).
      - name: JS advisories via OSV (blocks merge)
        run: |
          curl -sSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source --lockfile app/pnpm-lock.yaml
      - run: pnpm --dir app build
      # bundle-size budget gate: read the manifest from the build above and fail
      # if the main chunk / any chunk / the total crosses its ceiling (budgets in
      # app/scripts/check-bundle-size.mjs + CONTRIBUTING.md). Catches the "chunk >
      # 500 kB" class of regression at PR time. Breakdown goes to the job summary.
      - name: Bundle size budget
        run: node app/scripts/check-bundle-size.mjs app/dist
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  # Coverage gate + visibility. Pure-JS, so it skips the Rust/bun/apt setup the
  # `check` job needs and runs fast & independent. `pnpm coverage` enforces the
  # per-layer thresholds in vitest.config.ts: it exits non-zero (failing the PR)
  # the moment a layer's coverage slips below its floor — erosion fails the gate
  # instead of landing silently. The job also captures coverage-final.json as an
  # artifact and posts/updates ONE sticky PR comment with the total % (and the
  # delta vs the last run, read back from that same comment so no base build is
  # needed). Forks can't comment (no token write) — the step degrades to a log.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post/update the coverage comment
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm --dir app install --frozen-lockfile
      # the gate: thresholds live in vitest.config.ts; a drop exits non-zero.
      # the config's json-summary reporter writes a tiny totals file the comment
      # step parses without re-reading the 1 MB per-file v8 json.
      - name: Coverage (enforces thresholds — fails if a layer drops)
        run: pnpm --dir app coverage
      - name: Upload coverage report
        if: always() # keep the artifact even when the gate fails, for triage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            app/coverage/coverage-final.json
            app/coverage/coverage-summary.json
            app/coverage/lcov.info
          if-no-files-found: warn
      - name: Comment coverage on the PR
        if: always() # comment whether the gate passed or failed
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const tag = '<!-- mew-coverage -->'
            const path = 'app/coverage/coverage-summary.json'
            if (!fs.existsSync(path)) {
              core.info('no coverage-summary.json — coverage run produced no report; skipping comment.')
              return
            }
            const pct = JSON.parse(fs.readFileSync(path, 'utf8')).total.lines.pct
            const gateFailed = '${{ job.status }}' === 'failure'

            // read the delta off our own previous sticky comment (no base build)
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const prev = comments.find((c) => c.body.includes(tag))
            const m = prev && prev.body.match(/Coverage:\s\*\*([\d.]+)%/)
            let delta = ''
            if (m) {
              const d = pct - parseFloat(m[1])
              const arrow = d > 0.05 ? '↑' : d < -0.05 ? '↓' : '→'
              delta = ` (${arrow} ${d >= 0 ? '+' : ''}${d.toFixed(1)}% vs last run)`
            }
            const verdict = gateFailed
              ? '\n\n❌ **Coverage gate failed** — a layer dropped below its threshold. See the job log for which layer, and add tests at that layer.'
              : '\n\n✅ Coverage thresholds met (domain 75 · adapters 50 · state 50).'
            const body = `${tag}\n📊 Coverage: **${pct}%** lines${delta}${verdict}`

            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  # Live model-contract smoke. Every adapter test mocks the SDK/fetch, so a wrong
  # request param/value/header (the shipped max_tokens-vs-max_completion_tokens
  # 400) passes the unit suite and still breaks users. This hits the real API to
  # prove the contract holds. Runs on release tags + manual dispatch (NOT on PRs,
  # so forks/PRs are never blocked). Keys come from repo secrets; absent → the
  # step logs a clear skip and exits 0 (no silent green — and a fork PR that can't
  # read secrets simply doesn't run this job).
  smoke:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm --dir app install --frozen-lockfile
      - name: Live model smoke (skips when no keys)
        env:
          MEW_SMOKE: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice title=model smoke skipped::no ANTHROPIC_API_KEY / OPENAI_API_KEY secret present — live model smoke skipped (set a repo secret to exercise it)."
            exit 0
          fi
          [ -n "$ANTHROPIC_API_KEY" ] && echo "ANTHROPIC_API_KEY present — running Anthropic live smoke." || echo "ANTHROPIC_API_KEY absent — Anthropic case will skip."
          [ -n "$OPENAI_API_KEY" ] && echo "OPENAI_API_KEY present — running OpenAI live smoke." || echo "OPENAI_API_KEY absent — OpenAI case will skip."
          pnpm --dir app smoke:models

  # tag v* → installers + updater manifest on a GitHub Release
  # workflow_dispatch → same build, nothing published (release dry-run)
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # macOS leg (#249): macos-latest is Apple silicon — build-sidecar.mjs
          # resolves aarch64-apple-darwin from the host rustc, and
          # tauri.macos.conf.json swaps bundle.targets to app+dmg (the base
          # msi/nsis/deb list would bundle nothing on darwin). Unsigned until
          # Apple signing secrets exist; Intel needs its own leg or a
          # universal build if anyone asks.
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - uses: oven-sh/setup-bun@v2
      # each runner compiles its own sidecar (linux-gnu / windows-msvc) so
      # `tauri build` finds binaries/gbrain-<host-triple> to bundle
      - run: node desktop/scripts/build-sidecar.mjs
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir desktop install --frozen-lockfile
      # Signed updater artifacts are gated on the signing key, same as
      # includeUpdaterJson below. The committed tauri.conf.json keeps
      # createUpdaterArtifacts:false so a keyless build (the v0.1.x line, a
      # dry-run before the secret is added) can't fail looking for a private key
      # to sign with. When the key secret exists, flip it true in this runner's
      # checkout so `tauri build` emits the .sig files latest.json is assembled
      # from. node (not jq) so the patch is identical on Linux and Windows; the
      # committed file is never touched — no key → no flip → keyless build
      # succeeds and self-update simply stays dormant (graceful degradation).
      # the `secrets` context isn't available in a step `if:`, so resolve the
      # gate into an env bool first (env values CAN read secrets) and branch on it
      - name: Enable signed updater artifacts (only when a signing key is set)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: node -e "const f='desktop/src-tauri/tauri.conf.json',c=require('./'+f);c.bundle.createUpdaterArtifacts=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n');console.log('createUpdaterArtifacts set true (signing key present)')"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater artifact signing — without these the build still works,
          # but latest.json signatures (and so self-update) need them
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          # on workflow_dispatch tagName is empty → build-only, no release
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('MEW {0}', github.ref_name) || '' }}
          # build into a DRAFT: concurrent matrix jobs can't both create a
          # PUBLISHED release for the same tag (the second 404s its lookup and
          # conflicts on create, dropping that platform's installers). They
          # coalesce into one shared draft instead; the publish job below flips
          # it live once every platform's assets are in.
          releaseDraft: true
          # …and only assemble + upload latest.json when those signatures exist.
          # (tauri-action v1 renamed includeUpdaterJson → uploadUpdaterJson; #245)
          uploadUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

  # flip the shared draft to a published release once all platforms have
  # uploaded — these are real builds, so they go live (no manual publish step).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Use this version's CHANGELOG.md section as the GitHub Release body, so
      # the release reads the same story as the changelog (Keep a Changelog).
      # The awk slices everything between this tag's `## [x.y.z]` heading and the
      # next `## [` — exactly that version's block. If the tag has no matching
      # section (changelog not updated for this version), skip the body and let
      # the tauri-action default stand, rather than wiping the notes to empty.
      - name: Set release notes from CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && (/^## \[/ || /^\[[^]]+\]:/) {f=0}
            f {print}
          ' CHANGELOG.md)
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" | gh release edit "$TAG" --repo "$REPO" --notes-file -
          else
            echo "::notice title=release notes::no CHANGELOG.md section for $VERSION — keeping the auto-generated body."
          fi
      - run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
