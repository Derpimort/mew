# Accepted-risk register for the Rust lockfile, read by
#   osv-scanner scan source --lockfile desktop/src-tauri/Cargo.lock
# CI's Rust gate is `cargo audit` (.github/workflows/audit.yml: fails on vulnerabilities,
# warns on unmaintained/unsound). This file keeps the OSV view of the same lockfile honest:
# every finding we knowingly ship is named here with its reason and a review date, so the
# scan reports "No issues found" only because each item was looked at — never because the
# gate was loosened. A real vulnerability is never listed here; it gets bumped instead
# (rustls RUSTSEC-2026-0285 → 0.23.45, anyhow → 1.0.103, event-listener → 5.4.2 in the
# same change). Re-check this list on every tauri bump: all of it is the tauri 2.11 Linux
# GTK stack (gtk/glib 0.18) and tauri-utils' urlpattern.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-12-31
reason = "glib 0.18.5 — informational 'unsound' (VariantStrIter). Pinned by tauri 2.11's GTK stack (gtk 0.18 → atk/gdk/webkit2gtk 0.18); the fix is glib 0.20, unreachable until tauri moves its gtk-rs line. MEW never calls glib::VariantStrIter. (OSV also lists it as GHSA-wrw7-89jp-8q8g; the alias is covered by this entry.)"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2026-12-31
reason = "proc-macro-error 1.0.4 — unmaintained. Compile-time only: pulled by glib-macros 0.18.5 (proc-macro) via the tauri 2.11 GTK stack; no runtime code. Leaves with glib 0.20."

[[IgnoredVulns]]
