[package]
name = "mew-desktop"
version = "0.1.0"
description = "MEW — My Entire Week, as a desktop shell around the local-first SPA"
edition = "2021"

[lib]
name = "mew_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# phase 2 (auto-backup): on-disk snapshots under $DOCUMENT/MEW + "open folder"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# phase 3 (calendar connect): Google blocks OAuth in webviews — system
# browser + localhost loopback instead
tauri-plugin-oauth = "2"
# phase 4 (self-update): GitHub Releases latest.json, staged install —
# the human picks the restart moment; dialog ships for native fallbacks
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[profile.release]
strip = true
lto = true
