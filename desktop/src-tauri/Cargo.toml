[package]
name = "mew-desktop"
version = "0.1.0"
description = "MEW — My Entire Week, as a desktop shell around the local-first SPA"
edition = "2021"

[lib]
name = "mew_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray companion (#283): `tray-icon` is core Tauri 2 (no plugin); `image-png`
# lets the embedded state-dot PNGs (icons/tray/) parse into tray icons
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# generate_context!'s expansion references ::serde_json directly in recent
# tauri point releases — fleet CI broke on every regenerated lockfile
serde_json = "1"
# phase 2 (auto-backup): on-disk snapshots under $DOCUMENT/MEW + "open folder"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# phase 3 (calendar connect): Google blocks OAuth in webviews — system
# browser + localhost loopback instead
tauri-plugin-oauth = "2"
# phase 4 (self-update): GitHub Releases latest.json, staged install —
# the human picks the restart moment; dialog ships for native fallbacks
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# native OS notifications for start-by/drift/end-of-day nudges (#168) — the
# webview mirrors the newest nudge through window.__TAURI__.notification;
# local-only, no network, keys unaffected
tauri-plugin-notification = "2"
# OS-global quick-capture hotkey (#284): registration lives Rust-side behind
# one app command (set_capture_hotkey) — the webview never gets register rights
tauri-plugin-global-shortcut = "2"
# phase 5 (built-in brain): the bundled gbrain sidecar is spawned and killed
# from Rust only — the webview gets an endpoint handshake, never spawn rights
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
strip = true
lto = true
