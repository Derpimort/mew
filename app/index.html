<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pixie-poly-face.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060708" />
    <title>MEW — My Entire Week</title>
    <!-- Fonts are self-hosted in /public/fonts and declared with @font-face in
         tokens.css — no Google-CDN link, so MEW renders fully offline and under
         the desktop CSP. Preload the default sans/mono faces for first paint. -->
    <link
      rel="preload"
      href="/fonts/hanken-grotesk-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
