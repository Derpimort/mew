# Shared security headers. nginx's add_header does NOT inherit when a location
# adds its own headers, so every location that sets one re-includes this file.
#
# The app holds a BYO Anthropic key in browser storage — XSS is the threat
# model, so the CSP is tight and enumerates every legitimate origin:
#   script/frame  accounts.google.com   — Google Identity Services (calendar OAuth)
#   connect       api.anthropic.com     — BYO-key model calls (browser-direct)
#                 www.googleapis.com    — Calendar REST
#                 localhost:11434       — "Fully local" Ollama on the user's machine
#   style/font    Google Fonts (Hanken Grotesk, Newsreader)
# COOP must be same-origin-allow-popups or the Google sign-in popup breaks.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.gstatic.com; connect-src 'self' https://api.anthropic.com https://www.googleapis.com https://accounts.google.com http://localhost:11434 http://127.0.0.1:11434; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
