# MEW commands for the `app` helper on aisquare-ec2-dev boxes.
# Read at runtime; edit + commit and the next `app refresh` picks them up.
# The built-ins (refresh/up/down/debug/logs/ps/shell) already cover the
# compose loop — these add the project-specific checks, dockerized so the
# box needs no node/pnpm.

test      = docker compose -f docker-compose.yml -f docker-compose.debug.yml run --rm --build mew pnpm test
typecheck = docker compose -f docker-compose.yml -f docker-compose.debug.yml run --rm --build mew pnpm typecheck
check     = docker compose -f docker-compose.yml -f docker-compose.debug.yml run --rm --build mew sh -c "pnpm test && pnpm typecheck"
